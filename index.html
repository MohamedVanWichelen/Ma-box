<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Ma box</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f5fb;
            color: #20243a;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .box {
            width: min(100%, 380px);
            min-height: 290px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 36px 28px;
            border: 1px solid #e8e9f2;
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 20px 55px rgb(38 43 77 / 9%);
            text-align: center;
        }

        .box h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.04em;
        }

        .box p {
            margin: -8px 0 4px;
            color: #777b91;
            font-size: 0.95rem;
        }

        .circle-button {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: #6558e8;
            box-shadow: 0 9px 20px rgb(101 88 232 / 30%);
            color: #fff;
            cursor: pointer;
            transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
        }

        .circle-button:hover {
            transform: translateY(-3px);
            background: #5548d5;
            box-shadow: 0 13px 24px rgb(101 88 232 / 36%);
        }

        .circle-button:active {
            transform: scale(0.96);
        }

        .circle-button:focus-visible {
            outline: 4px solid #c9c4ff;
            outline-offset: 4px;
        }

        .circle-button svg {
            width: 30px;
            height: 30px;
        }

        @media (prefers-reduced-motion: reduce) {
            .circle-button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="box">
        <h1>Ma box</h1>
        <p>Appuie sur le bouton pour commencer</p>
        <button class="circle-button" type="button" aria-label="Commencer">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </button>
    </main>
</body>
</html>
